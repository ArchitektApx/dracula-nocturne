# Dracula Nocturne for lazygit. Generated from palette.toml by `nocturne build`: edit that, not this.
#
# lazygit merges every file in LG_CONFIG_FILE, so this can sit next to your own config:
#   export LG_CONFIG_FILE="$HOME/.config/lazygit/config.yml,$HOME/.config/dracula-nocturne/lazygit/dracula-nocturne.yml"
gui:
  theme:
    activeBorderColor:
      - "{{purple}}"
      - bold
    inactiveBorderColor:
      - "{{comment}}"
    searchingActiveBorderColor:
      - "{{pink}}"
      - bold
    optionsTextColor:
      - "{{cyan}}"
    selectedLineBgColor:
      - "{{selection}}"
    inactiveViewSelectedLineBgColor:
      - "{{surface}}"
    cherryPickedCommitFgColor:
      - "{{bg}}"
    cherryPickedCommitBgColor:
      - "{{cyan}}"
    markedBaseCommitFgColor:
      - "{{bg}}"
    markedBaseCommitBgColor:
      - "{{yellow}}"
    unstagedChangesColor:
      - "{{red}}"
    defaultFgColor:
      - "{{fg}}"
