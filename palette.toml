warningSurface = "#271f16"
update = "#8be9fd"
updateForeground = "#a8effd"
updateSurface = "#192527"
searchMatchBackground = "#8c6c1f"
searchMatchActiveBackground = "#eea52b"
searchMatchForeground = "#f5f5f5"
