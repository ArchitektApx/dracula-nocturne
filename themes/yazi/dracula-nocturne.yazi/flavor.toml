# Dracula Nocturne for yazi. Generated from palette.toml by `nocturne build`: edit that, not this.
#
# Link or copy this folder to ~/.config/yazi/flavors/, then in ~/.config/yazi/theme.toml:
#   [flavor]
#   dark = "dracula-nocturne"
#
# File colours match the eza theme and LS_COLORS. Code previews use tmtheme.xml (the bat theme).

[mgr]
cwd = { fg = "#8be9fd" }

find_keyword  = { fg = "#f1fa8c", bold = true, underline = true }
find_position = { fg = "#ff79c6", bg = "reset", bold = true }

marker_copied   = { fg = "#50fa7b", bg = "#50fa7b" }
marker_cut      = { fg = "#ff5555", bg = "#ff5555" }
marker_marked   = { fg = "#8be9fd", bg = "#8be9fd" }
marker_selected = { fg = "#ff79c6", bg = "#ff79c6" }

count_copied   = { fg = "#0a0a0a", bg = "#50fa7b" }
count_cut      = { fg = "#0a0a0a", bg = "#ff5555" }
count_selected = { fg = "#0a0a0a", bg = "#ff79c6" }

border_symbol = "│"
border_style  = { fg = "#21222c" }

[indicator]
parent  = { reversed = true }
current = { bg = "#35374a" }
preview = { underline = true }

# Tabs and modes as pills, like the tmux tabs: pink for the current one, surface for the rest
[tabs]
active   = { fg = "#0a0a0a", bg = "#ff79c6", bold = true }
inactive = { fg = "#bd93f9", bg = "#21222c" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#0a0a0a", bg = "#bd93f9", bold = true }
normal_alt  = { fg = "#bd93f9", bg = "#21222c" }
select_main = { fg = "#0a0a0a", bg = "#ff79c6", bold = true }
select_alt  = { fg = "#ff79c6", bg = "#21222c" }
unset_main  = { fg = "#0a0a0a", bg = "#ffb86c", bold = true }
unset_alt   = { fg = "#ffb86c", bg = "#21222c" }

[status]
overall    = { fg = "#6272a4" }
sep_left   = { open = "", close = "" }
sep_right  = { open = "", close = "" }
perm_sep   = { fg = "#6272a4" }
perm_type  = { fg = "#bd93f9" }
perm_read  = { fg = "#f1fa8c" }
perm_write = { fg = "#ff5555" }
perm_exec  = { fg = "#50fa7b" }
progress_label  = { fg = "#f8f8f2", bold = true }
progress_normal = { fg = "#bd93f9", bg = "#21222c" }
progress_error  = { fg = "#ff5555", bg = "#21222c" }

[which]
cols            = 3
mask            = { bg = "#0a0a0a" }
cand            = { fg = "#ff79c6" }
rest            = { fg = "#6272a4" }
desc            = { fg = "#f8f8f2" }
separator       = "  "
separator_style = { fg = "#6272a4" }

[confirm]
border  = { fg = "#bd93f9" }
title   = { fg = "#bd93f9" }
btn_yes = { fg = "#0a0a0a", bg = "#ff79c6" }
btn_no  = {}

[spot]
border   = { fg = "#bd93f9" }
title    = { fg = "#bd93f9" }
tbl_col  = { fg = "#8be9fd" }
tbl_cell = { fg = "#ff79c6", bg = "#35374a" }

[notify]
title_info  = { fg = "#50fa7b" }
title_warn  = { fg = "#f1fa8c" }
title_error = { fg = "#ff5555" }

[pick]
border   = { fg = "#bd93f9" }
active   = { fg = "#ff79c6", bold = true }
inactive = {}

[input]
border   = { fg = "#bd93f9" }
title    = {}
value    = {}
selected = { bg = "#35374a" }

[cmp]
border   = { fg = "#bd93f9" }
active   = { fg = "#ff79c6", bg = "#35374a" }
inactive = {}

[tasks]
border  = { fg = "#bd93f9" }
title   = {}
hovered = { fg = "#ff79c6", bold = true }

[help]
border  = { fg = "#bd93f9" }
chord   = { fg = "#ff79c6" }
action  = { fg = "#8be9fd" }
hovered = { bg = "#35374a", bold = true }

[filetype]
rules = [
	{ mime = "**/image/*", fg = "#ff79c6" },
	{ mime = "**/{audio,video}/*", fg = "#ff79c6" },
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ffb86c" },
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#f1fa8c" },
	{ mime = "vfs/{absent,stale}", fg = "#6272a4" },
	{ url = "*", is = "orphan", fg = "#ff5555" },
	{ url = "*", is = "link", fg = "#8be9fd" },
	{ url = "*", is = "exec", fg = "#50fa7b" },
	{ url = "*", fg = "#f8f8f2" },
	{ url = "*/", fg = "#bd93f9", bold = true },
]

# Folder and link icons in the file colours (yazi's own are blue); file icons keep their colours
[icon]
prepend_conds = [
	{ if = "dir", text = "", fg = "#bd93f9" },
	{ if = "link", text = "", fg = "#8be9fd" },
	{ if = "orphan", text = "", fg = "#ff5555" },
]
