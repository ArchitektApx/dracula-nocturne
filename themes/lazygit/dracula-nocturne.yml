# Dracula Nocturne for lazygit. Generated from palette.toml by `nocturne build`: edit that, not this.
#
# lazygit merges every file in LG_CONFIG_FILE, so this can sit next to your own config:
#   export LG_CONFIG_FILE="$HOME/.config/lazygit/config.yml,$HOME/.config/dracula-nocturne/lazygit/dracula-nocturne.yml"
gui:
  theme:
    activeBorderColor:
      - "#bd93f9"
      - bold
    inactiveBorderColor:
      - "#6272a4"
    searchingActiveBorderColor:
      - "#ff79c6"
      - bold
    optionsTextColor:
      - "#8be9fd"
    selectedLineBgColor:
      - "#35374a"
    inactiveViewSelectedLineBgColor:
      - "#21222c"
    cherryPickedCommitFgColor:
      - "#0a0a0a"
    cherryPickedCommitBgColor:
      - "#8be9fd"
    markedBaseCommitFgColor:
      - "#0a0a0a"
    markedBaseCommitBgColor:
      - "#f1fa8c"
    unstagedChangesColor:
      - "#ff5555"
    defaultFgColor:
      - "#f8f8f2"
