# Dracula Nocturne for kitty, the look. Generated from palette.toml by `nocturne build`: edit that, not this.

background_opacity 0.7
background_blur 20
inactive_text_alpha 0.85
cursor_shape block
cursor_stop_blinking_after 0
cursor_trail 1
cursor_trail_decay 0.1 0.4
window_padding_width 6 8
tab_bar_style powerline
# per system: KITTY_OS is macos, linux or bsd
globinclude look-${KITTY_OS}.conf
