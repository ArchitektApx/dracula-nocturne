# Dracula Nocturne for kitty. Generated from palette.toml by `nocturne build`: edit that, not this.

background #0a0a0a
foreground #f8f8f2
cursor #ff79c6
cursor_text_color #0a0a0a
selection_background #35374a
selection_foreground none
url_color #8be9fd

color0 #21222c
color1 #ff5555
color2 #50fa7b
color3 #f1fa8c
color4 #bd93f9
color5 #ff79c6
color6 #8be9fd
color7 #f8f8f2
color8 #6272a4
color9 #ff6e6e
color10 #69ff94
color11 #ffffa5
color12 #d6acff
color13 #ff92df
color14 #a4ffff
color15 #ffffff

# Splits: the divider as in Ghostty, plus a purple border on the active window
active_border_color #bd93f9
inactive_border_color #35374a
bell_border_color #ff5555

# Tabs: pink for the current one, surface for the rest
tab_bar_background #0a0a0a
active_tab_background #ff79c6
active_tab_foreground #0a0a0a
inactive_tab_background #21222c
inactive_tab_foreground #6272a4

# Marks (kitty's highlight markers)
mark1_background #bd93f9
mark1_foreground #0a0a0a
mark2_background #ff79c6
mark2_foreground #0a0a0a
mark3_background #f1fa8c
mark3_foreground #0a0a0a
