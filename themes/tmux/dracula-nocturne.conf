# Dracula Nocturne for tmux. Generated from palette.toml by `nocturne build`: edit that, not this.
#
# Needs tmux 3.3 or newer. Load it from your tmux.conf, after your own settings:
#   source-file ~/.config/dracula-nocturne/tmux/dracula-nocturne.conf
#
# Options (set them before the source-file line):
#   set -g @nocturne-spacer off    no empty line between the terminal and the tab bar
#   set -g @nocturne-position top  tab bar at the top
#
# Tabs are pills with rounded caps (Nerd Font). The badge on the left is purple, pink while the
# prefix is held, yellow in copy mode. A tab whose window option @ssh_host is set shows that
# server in orange (extras/tmux-ssh-host.zsh sets it while ssh runs).

set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#6272a4"

%if "#{==:#{@nocturne-position},top}"
set -g status-position top
%else
set -g status-position bottom
%endif

# Two status lines with the one between the panes and the tabs left empty: a bit of air.
# The reset first keeps a reload from copying the already emptied line.
set -gu status-format
%if "#{==:#{@nocturne-spacer},off}"
set -g status on
%elif "#{==:#{@nocturne-position},top}"
set -g status 2
set -g "status-format[1]" ""
%else
set -g status 2
set -Fg "status-format[1]" "#{status-format[0]}"
set -g "status-format[0]" ""
%endif

%hidden BADGE="#{?client_prefix,#ff79c6,#{?pane_in_mode,#f1fa8c,#bd93f9}}"
set -g status-left-length 20
set -g status-left "#[fg=${BADGE}]#[fg=#0a0a0a,bg=${BADGE}] \U000F02A0 #[fg=${BADGE},bg=default]  "
set -g status-right ""

setw -g window-status-style "default"
setw -g window-status-current-style "default"
setw -g window-status-bell-style "fg=#ff5555"
setw -g window-status-separator "  "

# Icon: a folder while a shell waits at the prompt, a terminal while a program runs
%hidden ICON="#{?#{m/r:^(zsh|bash|fish|sh|nu|iris)$,#{pane_current_command}},,}"
%hidden NAME_BG="#{?@ssh_host,#ffb86c,#bd93f9}"
%hidden ZOOM="#{?window_zoomed_flag, ,}"
setw -g window-status-format "#[fg=#21222c]#[fg=#bd93f9,bg=#21222c] #I #{?@ssh_host,#[fg=#ffb86c]\U000F048B #{@ssh_host},#[fg=#6272a4]${ICON} #W}${ZOOM} #[fg=#21222c,bg=default]"
setw -g window-status-current-format "#[fg=#ff79c6]#[fg=#0a0a0a,bg=#ff79c6,bold] #I #[bg=${NAME_BG}] #{?@ssh_host,\U000F048B #{@ssh_host},${ICON} #W}${ZOOM} #[fg=${NAME_BG},bg=default,nobold]"

# Panes: purple border on the active one; inactive panes fade their plain text to the comment colour
set -g pane-border-style "fg=#21222c"
set -g pane-active-border-style "fg=#bd93f9"
set -g pane-border-lines heavy
set -g window-style "fg=#6272a4"
set -g window-active-style "fg=terminal"

set -g popup-border-lines rounded
set -g popup-border-style "fg=#bd93f9"
set -g popup-style "bg=default"

set -g message-style "bg=#21222c,fg=#f8f8f2"
set -g message-command-style "bg=#21222c,fg=#f8f8f2"
set -g mode-style "bg=#35374a"
set -g copy-mode-match-style "bg=#44475a"
set -g copy-mode-current-match-style "bg=#ffb86c,fg=#0a0a0a"
set -g clock-mode-colour "#bd93f9"
