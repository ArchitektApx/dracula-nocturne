# Dracula Nocturne for AeroSpace. Generated from palette.toml by `nocturne build`: edit that, not this.
#
# aerospace.toml can't include other files, so these go into yours by hand.

# The window borders (JankyBorders, `nocturne install borders`), started with AeroSpace
after-startup-command = ['exec-and-forget borders']

# Room around and between the windows, so the borders and the desktop show
[gaps]
inner.horizontal = 16
inner.vertical = 16
outer.left = 16
outer.bottom = 16
outer.top = 16
outer.right = 16
